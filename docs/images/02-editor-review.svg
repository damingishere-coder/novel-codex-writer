<text x="575" y="235" font-size="16" fill="#A5A9B5" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">01</text><text x="625" y="235" font-size="21" class="t">雨从城楼的飞檐上倾下来，像一层压低的银幕。</text><text x="575" y="295" font-size="16" fill="#A5A9B5" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">02</text><text x="625" y="295" font-size="21" class="t">林序收起斗笠，抬头看向城门上那盏摇晃的红灯。</text><text x="575" y="355" font-size="16" fill="#A5A9B5" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">03</text><text x="625" y="355" font-size="21" class="t">守门人没有问路引，只盯着他腰间那柄旧刀。</text><text x="575" y="415" font-size="16" fill="#A5A9B5" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">04</text><text x="625" y="415" font-size="21" class="t">“外乡人？”</text><text x="575" y="475" font-size="16" fill="#A5A9B5" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">05</text><text x="625" y="475" font-size="21" class="t">林序笑了笑：“今晚之后，也许就不是了。”</text><text x="575" y="535" font-size="16" fill="#A5A9B5" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">06</text><text x="625" y="535" font-size="21" class="t">远处忽然传来三声急钟。街上的灯火同时暗了半截。</text>
