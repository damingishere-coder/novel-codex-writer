name: 功能建议
description: 从真实创作场景提出改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请尽量描述真实使用场景，而不是只写一个功能名称。

  - type: dropdown
    id: user
    attributes:
      label: 主要使用者
      options:
        - 小说作者
        - Codex / Agent 用户
        - 项目开发者
        - 多类用户
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 现在的创作或管理流程哪里不方便？
      placeholder: 当我写到几十章后……
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
      description: 描述完成后的用户体验，不必先限定具体技术实现
      placeholder: 我希望能够……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 可选。可以描述界面、流程或数据结构想法

  - type: dropdown
    id: compatibility
    attributes:
      label: 是否可能改变小说目录或记忆格式？
      options:
        - 不会
        - 可能会
        - 会
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前使用的替代方式
      description: 你现在如何绕过或手动解决这个问题？

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 和 Roadmap
          required: true
        - label: 这个建议不会要求默认上传用户密钥或私密正文
          required: true
